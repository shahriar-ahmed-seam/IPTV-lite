<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarango — IPTV Player</title>
  <meta name="description" content="Tarango Desktop IPTV Player — Lightweight, fast channel browsing with HLS streaming">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Custom Title Bar (Discord/WhatsApp style) -->
  <div id="titlebar">
    <div id="titlebar-brand">
      <div class="brand-icon">T</div>
      <span>Tarango</span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="btn-title-fullscreen" title="Toggle Fullscreen (F11)">
        <svg id="icon-title-fs-enter" viewBox="0 0 16 16"><path d="M1.5 1.5h4v1h-3v3h-1v-4zm9 0h4v4h-1v-3h-3v-1zm4 9v4h-4v-1h3v-3h1zm-13 3v-3h1v3h3v1h-4z" fill="currentColor"/></svg>
        <svg id="icon-title-fs-exit" viewBox="0 0 16 16" style="display:none;"><path d="M5.5 5.5h-4v-1h3v-3h1v4zm5 0h4v-1h-3v-3h-1v4zm4 5h-4v1h3v3h1v-4zm-9 1h-3v-3h-1v4h4v-1z" fill="currentColor"/></svg>
      </button>
      <button class="titlebar-btn" id="btn-minimize" title="Minimize">
        <svg viewBox="0 0 16 16"><rect x="3" y="7.5" width="10" height="1" fill="currentColor"/></svg>
      </button>
      <button class="titlebar-btn" id="btn-maximize" title="Maximize">
        <svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" stroke="currentColor" stroke-width="1" fill="none"/></svg>
      </button>
      <button class="titlebar-btn close" id="btn-close" title="Close">
        <svg viewBox="0 0 16 16"><line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.2"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </div>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-title">তরঙ্গ</div>
    <div class="splash-subtitle">TARANGO IPTV PLAYER</div>
    <div class="splash-spinner"></div>
  </div>

  <!-- Main App -->
  <div id="app">
    <!-- Header: brand + search + source + actions -->
    <div id="header">
      <div class="brand-text">তরঙ্গ</div>
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-box" placeholder="Search channels..." autocomplete="off" spellcheck="false">
      </div>
      <span class="header-label">Source</span>
      <select id="source-select"></select>
      <button class="header-btn" id="btn-add-source" title="Add / Manage Sources">＋</button>
      <button class="header-btn" id="btn-favorites" title="Favourites">★</button>
    </div>

    <!-- Category chips -->
    <div id="category-bar"></div>

    <!-- Channel grid -->
    <div id="grid-container">
      <div id="channel-grid"></div>
    </div>

    <!-- Status / empty state -->
    <div id="status-text"></div>
  </div>

  <!-- Fullscreen Player Overlay -->
  <div id="player-overlay">
    <video id="player-video" autoplay></video>
    <div class="player-banner" id="player-banner"></div>
    <div class="player-number-entry" id="player-number"></div>
    <div class="player-status" id="player-status"></div>

    <!-- Player Top Action Buttons -->
    <div class="player-top-actions">
      <button class="player-action-btn" id="btn-player-pip" title="Pop-up Resizable Viewer (P) - Watch while working">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"></rect>
          <rect x="11" y="9" width="9" height="7" rx="1" fill="currentColor" fill-opacity="0.3"></rect>
        </svg>
      </button>
      <button class="player-action-btn" id="btn-player-fullscreen" title="Toggle Fullscreen (F / F11)">
        <svg id="icon-player-fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
        <svg id="icon-player-fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <polyline points="4 14 10 14 10 20"></polyline>
          <polyline points="20 10 14 10 14 4"></polyline>
          <line x1="14" y1="10" x2="21" y2="3"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
      </button>
      <button class="player-action-btn close" id="player-back" title="Back to channels (Esc)">✕</button>
    </div>

    <!-- Modern Interactive Bottom Control Bar -->
    <div class="player-channel-bar" id="player-channel-bar">
      <!-- Left: Channel Info -->
      <div class="player-bar-left">
        <img class="player-ch-logo" id="player-ch-logo" alt="">
        <div class="player-ch-details">
          <div class="player-ch-title-row">
            <span class="player-live-badge"><span class="dot"></span>LIVE</span>
            <span class="player-ch-name" id="player-ch-name"></span>
          </div>
          <div class="player-ch-group" id="player-ch-group"></div>
        </div>
      </div>

      <!-- Center: Playback Controls -->
      <div class="player-bar-center">
        <button class="player-ctrl-btn" id="btn-player-prev" title="Previous Channel (↑ or [)">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
        </button>
        <button class="player-ctrl-btn play-pause" id="btn-player-play" title="Play / Pause (Space)">
          <svg id="icon-main-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
          <svg id="icon-main-play" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <button class="player-ctrl-btn" id="btn-player-next" title="Next Channel (↓ or ])">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
        </button>
      </div>

      <!-- Right: Volume + Pop-up + Fullscreen -->
      <div class="player-bar-right">
        <div class="player-volume-wrapper">
          <button class="player-ctrl-btn" id="btn-player-mute" title="Mute / Unmute (M)">
            <svg id="icon-main-vol-high" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="icon-main-vol-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>
          <input type="range" id="player-volume-slider" class="player-vol-range" min="0" max="1" step="0.05" value="1" title="Volume">
        </div>
        <button class="player-ctrl-btn" id="btn-player-pip-bottom" title="Pop-up Resizable Viewer (P) - Watch while working">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <rect x="11" y="9" width="9" height="7" rx="1" fill="currentColor" fill-opacity="0.3"></rect>
          </svg>
        </button>
        <button class="player-ctrl-btn" id="btn-player-fs-bottom" title="Fullscreen (F / F11)">
          <svg id="icon-bottom-fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <svg id="icon-bottom-fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <polyline points="4 14 10 14 10 20"></polyline>
            <polyline points="20 10 14 10 14 4"></polyline>
            <line x1="14" y1="10" x2="21" y2="3"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Quick shortcuts hint -->
    <div class="player-controls-hint">
      <span class="hint-key"><kbd>Space</kbd> Play/Pause</span>
      <span class="hint-key"><kbd>F</kbd> Fullscreen</span>
      <span class="hint-key"><kbd>P</kbd> Pop-up</span>
      <span class="hint-key"><kbd>↑</kbd><kbd>↓</kbd> Channels</span>
      <span class="hint-key"><kbd>←</kbd><kbd>→</kbd> Vol</span>
      <span class="hint-key"><kbd>M</kbd> Mute</span>
      <span class="hint-key"><kbd>0-9</kbd> Jump</span>
      <span class="hint-key"><kbd>Esc</kbd> Back</span>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <!-- Manage Sources Modal -->
  <div class="modal-backdrop" id="modal-sources">
    <div class="modal">
      <div class="modal-title">Add / Manage Sources</div>
      <input type="text" class="modal-input" id="input-source-name" placeholder="Source name (e.g. My Channels)">
      <input type="text" class="modal-input" id="input-source-url" placeholder="Playlist URL (http:// or https://)">
      <div class="modal-buttons">
        <button class="modal-btn primary" id="btn-add-source-confirm">Add Source</button>
        <button class="modal-btn" id="btn-sources-close">Close</button>
      </div>
      <div class="modal-divider"></div>
      <div id="custom-sources-list"></div>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div class="modal-backdrop confirm-modal" id="modal-confirm">
    <div class="modal">
      <div class="modal-title" id="confirm-title">Confirm</div>
      <div class="confirm-message" id="confirm-message"></div>
      <div class="modal-buttons">
        <button class="modal-btn primary" id="confirm-yes">Yes</button>
        <button class="modal-btn" id="confirm-no">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
