name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.3.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Signing Keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -v -keystore app/release.keystore -alias bdlivetv -keyalg RSA -keysize 2048 -validity 10000 -storepass bdlivetv2026 -keypass bdlivetv2026 -dname "CN=Tarango, OU=IPTV, O=Tarango, L=Dhaka, ST=Dhaka, C=BD"
          fi

      - name: Build Android Release APK
        run: ./gradlew assembleRelease

      - name: Stage Android APK artifact
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/release/app-release.apk build-artifacts/tarango-android-tv.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build-artifacts/tarango-android-tv.apk
          if-no-files-found: error

  build-desktop-linux:
    name: Build Linux Desktop Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: tarango-desktop/package-lock.json

      - name: Install dependencies
        working-directory: tarango-desktop
        run: npm ci

      - name: Build Linux AppImage and DEB
        working-directory: tarango-desktop
        run: npm run build:linux

      - name: Upload Linux Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            tarango-desktop/dist/*.AppImage
            tarango-desktop/dist/*.deb
          if-no-files-found: error

  build-desktop-windows:
    name: Build Windows Desktop Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: tarango-desktop/package-lock.json

      - name: Install dependencies
        working-directory: tarango-desktop
        run: npm ci

      - name: Build Windows NSIS Installer
        working-directory: tarango-desktop
        run: npm run build:win

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: tarango-desktop/dist/*.exe
          if-no-files-found: error

  release:
    name: Publish Multi-Platform Release
    needs: [build-android, build-desktop-linux, build-desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Organize release assets
        id: assets
        run: |
          mkdir -p release-assets
          # Android TV APK is placed first (primary release target for low-spec TV boxes)
          cp downloaded-artifacts/android-apk/*.apk release-assets/
          # Desktop packages
          cp downloaded-artifacts/desktop-linux/*.AppImage release-assets/
          cp downloaded-artifacts/desktop-linux/*.deb release-assets/
          cp downloaded-artifacts/desktop-windows/*.exe release-assets/
          echo "Staged release assets:"
          ls -lh release-assets/

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Tarango ${{ steps.tag.outputs.tag }}
          files: |
            release-assets/tarango-android-tv.apk
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.exe
          draft: false
          prerelease: false
          body: |
            ## Tarango Release ${{ steps.tag.outputs.tag }}

            ### Primary Download: Android TV Box (Low-Spec Optimized)

            | File | Platform | Architecture | Description |
            |---|---|---|---|
            | **`tarango-android-tv.apk`** | Android TV / Android Box / Phone | Universal (`arm64-v8a`, `armeabi-v7a`, `x86`) | Ultra-lightweight APK tailored for legacy and low-RAM TV boxes |

            #### Android TV Highlights
            - Specially optimized for low-RAM legacy TV boxes (Amlogic S905/S912, Allwinner, Rockchip, Android 5.0+).
            - No Google Play Services or WebView overhead. Direct hardware decoding via Media3 ExoPlayer.
            - Full TV remote D-Pad navigation, channel zapping (Up/Down), number-key channel jump, and category filter bar.
            - Multiple playlist sources with instant cache-first startup and auto-update on launch.

            ---

            ### Desktop Downloads (Linux & Windows)

            | File | Platform | Format | Description |
            |---|---|---|---|
            | **`Tarango-*.AppImage`** | Linux (Ubuntu, Debian, Fedora, Arch) | AppImage | Standalone portable executable |
            | **`tarango-desktop_*_amd64.deb`** | Linux (Debian, Ubuntu, Mint) | DEB Package | Native package install via `dpkg -i` |
            | **`Tarango Setup *.exe`** | Windows 10 / 11 | NSIS Installer | Full 64-bit installer with desktop shortcut |

            #### Desktop Highlights
            - **Resizable Pop-up Viewer (Picture-in-Picture)**: Floating resizable mini-player with Always-on-Top toggle to watch streams while working.
            - **Fullscreen Mode**: Toggle with dedicated button, double-click, or `F` / `F11` hotkey.
            - **Playback Controls**: Full play/pause (`Space`), mute (`M`), volume slider (`Left`/`Right` arrow keys), and channel cycling (`Up`/`Down`).
